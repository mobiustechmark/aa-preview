<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0b0d;--surface:#16161a;--raised:#1e1e24;
  --hairline:rgba(242,237,228,.09);
  --gold:#d4af37;--gold-bright:#f0c75e;--gold-pale:#fde08d;--gold-deep:#8f6b29;
  --cream:#f2ede4;--dim:#9c978c;--down:#f87171;
  --font-sans:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-display:'Cinzel','Times New Roman',serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(212,175,55,.08),transparent 60%),var(--ink);
  color:var(--cream);font-family:var(--font-sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold);color:var(--ink)}

.card{
  position:relative;width:100%;max-width:520px;background:var(--surface);
  border:1px solid var(--hairline);padding:44px 40px 38px;text-align:center;
  box-shadow:0 0 0 4px var(--ink),0 0 0 5px rgba(212,175,55,.3),0 8px 40px rgba(0,0,0,.45);
}
.card::before{content:'';position:absolute;inset:5px;border:1px solid rgba(242,237,228,.03);pointer-events:none}

.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);
}
h1{
  margin:14px 0 0;font-family:var(--font-display);font-weight:900;font-size:27px;
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--gold);text-shadow:0 0 24px rgba(212,175,55,.35);
}
.rule{height:1px;border:0;margin:22px auto;width:70%;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.6),transparent)}
.lede{margin:0;color:var(--dim);font-size:14.5px}

form{margin-top:26px;display:flex;flex-direction:column;gap:14px}
label{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);text-align:left}
input{
  width:100%;padding:13px 15px;background:var(--ink);color:var(--cream);
  border:1px solid var(--hairline);font-family:var(--font-sans);font-size:15px;
  outline:none;transition:border-color .2s;
}
input:focus{border-color:rgba(212,175,55,.6)}
input::placeholder{color:#5f5b55}

button{
  cursor:pointer;padding:14px 20px;font-family:var(--font-display);font-weight:700;
  font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#0b0b0d;
  border:1px solid rgba(253,224,141,.7);
  background:linear-gradient(180deg,#fde08d 0%,#d4af37 45%,#a8842c 100%);
  box-shadow:0 0 0 1px rgba(143,107,41,.9),0 4px 18px rgba(212,175,55,.25);
  transition:filter .2s;
}
button:hover:not(:disabled){filter:brightness(1.1)}
button:disabled{cursor:not-allowed;opacity:.5}

.msg{min-height:20px;margin:4px 0 0;font-size:13px}
.msg.err{color:var(--down)}
.msg.work{color:var(--dim)}
.foot{margin:24px 0 0;font-size:12px;color:#6a655e}
@media (max-width:520px){ .card{padding:34px 24px 28px} h1{font-size:22px} }
</style>
</head>
<body>

<main class="card">
  <div class="eyebrow">Appendage Antics</div>
  <h1>Private Preview</h1>
  <hr class="rule">
  <p class="lede">
    This preview is password protected. Enter the password you were sent to continue.
  </p>

  <form id="f" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" placeholder="Type or paste it here"
           autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <button id="go" type="submit">Enter</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <p class="foot">Adults only · 18+ · Not for distribution</p>
</main>

<script>
(function () {
  'use strict';

  /* The page holds only salt, iv and ciphertext. The password is the AES key
     material — it is not compared against anything here, so there is nothing
     to read out of this file. A wrong password fails the GCM tag and yields
     nothing at all. */
  var SALT = 'V83XwVgh1VcuQBVaDiiglA==';
  var IV   = 'LzxGLLJ6z16P1qKe';
  var CT   = '8nWdXCm92mPCezn/Ck/5apkyiRMm3+dhXTJIQyojqbNc4xHE0LU4Mc7Ssx7oALp1';
  var ITER = 600000;

  var f = document.getElementById('f');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');

  function b64(s) {
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  function say(text, cls) {
    msg.textContent = text;
    msg.className = 'msg' + (cls ? ' ' + cls : '');
  }

  if (!window.crypto || !window.crypto.subtle) {
    say('This browser cannot open the preview. Please try Chrome, Edge, Safari or Firefox.', 'err');
    go.disabled = true;
    return;
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var pass = pw.value.trim();
    if (!pass) return;

    go.disabled = true;
    /* 600k rounds is deliberate — it costs the reader a moment and costs
       anyone grinding the ciphertext offline a great deal more. */
    say('Checking…', 'work');

    var enc = new TextEncoder();
    window.crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(CT));
      })
      .then(function (plain) {
        var dir = new TextDecoder().decode(plain);
        if (!/^[a-f0-9]{32}$/.test(dir)) throw new Error('bad payload');
        say('Opening…', 'work');
        window.location.replace(dir + '/');
      })
      .catch(function () {
        go.disabled = false;
        say('That password was not recognised. Check for stray spaces and try again.', 'err');
        pw.select();
      });
  });

  pw.focus();
})();
</script>

</body>
</html>
